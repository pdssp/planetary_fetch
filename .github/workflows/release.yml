name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -ra

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Computes the next version from the conventional commits since the
      # last tag (fix -> patch, feat -> minor, BREAKING CHANGE / ! -> major),
      # then creates the tag and the GitHub release. No file is changed, so
      # nothing is committed back to main.
      - id: semrel
        uses: python-semantic-release/python-semantic-release@v9.21.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit: false
          changelog: false
          build: false

      # Built after tagging so that setuptools-scm reads the new version.
      - if: steps.semrel.outputs.released == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.semrel.outputs.released == 'true'
        run: |
          pip install build
          python -m build
      - if: steps.semrel.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.semrel.outputs.tag }}" dist/*
