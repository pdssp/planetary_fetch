name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --locked --no-default-groups --group test pytest -ra

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Check out the branch itself (not a detached commit) so that the
      # release commit can be pushed back to main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - run: git reset --hard ${{ github.sha }}

      - uses: astral-sh/setup-uv@v6

      # Computes the next version from the conventional commits since the
      # last tag (fix -> patch, feat -> minor, BREAKING CHANGE / ! -> major),
      # writes it to pyproject.toml and uv.lock, builds the package, then
      # commits "chore(release): <version>", tags it and creates the GitHub
      # release. Does nothing when no commit calls for a release.
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --from python-semantic-release==9.21.0 semantic-release version --no-changelog

      # Uploads dist/* to the GitHub release created above, if any.
      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --from python-semantic-release==9.21.0 semantic-release publish
